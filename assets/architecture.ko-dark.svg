<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="architecture-title architecture-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', 'Segoe UI', sans-serif">
  <title id="architecture-title">상시 실행 서비스 하나, OMP 헤드 하나, 독립 레인 세션</title>
  <desc id="architecture-desc">Discord, Telegram, Slack의 요청과 답변은 Gateway와 헤드 컨트롤러를 거칩니다. 연결된 주제의 일반 요청과 답변은 헤드 모델을 호출하지 않고 처리합니다. 헤드는 독립 레인 세션에 직접 작업을 맡깁니다. 위임 작업 결과, 헤드에 보낸 질문, 원본 메시지에 연결된 범위 검토 요청은 컨트롤러를 거쳐 헤드에 전달됩니다.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fc49c6"/><stop offset="0.5" stop-color="#b47cff"/><stop offset="1" stop-color="#57e6fb"/></linearGradient>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#a49bbd"/></marker>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#bb86ff"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="428" rx="20" fill="#0f0d16" stroke="#2c2640"/>
  <rect x="24" y="24" width="36" height="6" rx="3" fill="url(#hero)"/>
  <text x="24" y="60" font-size="24" font-weight="700" fill="#efeaf8">서비스 하나, 헤드 하나, 독립 레인</text>
  <g aria-hidden="true">
    <path d="M184 170H224" fill="none" stroke="#a49bbd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
    <path d="M398 170H446" fill="none" stroke="#a49bbd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
    <path d="M446 242H398" fill="none" stroke="#a49bbd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
    <path d="M224 242H184" fill="none" stroke="#a49bbd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
    <path d="M638 164H684V122H754" fill="none" stroke="#bb86ff" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#control-arrow)"/>
    <path d="M754 162H714V200H638" fill="none" stroke="#a49bbd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
    <path d="M638 234H714V266H754" fill="none" stroke="#bb86ff" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#control-arrow)"/>
    <path d="M754 306H684V258H638" fill="none" stroke="#a49bbd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
  </g>
  <g>
    <rect x="24" y="132" width="160" height="142" rx="14" fill="#17141f" stroke="#3f3854" stroke-width="1.5"/>
    <text x="104" y="165" font-size="22" font-weight="700" text-anchor="middle" fill="#efeaf8">메신저</text>
    <text x="104" y="197" font-size="16" text-anchor="middle" fill="#b7aecb">Discord</text>
    <text x="104" y="221" font-size="16" text-anchor="middle" fill="#b7aecb">Telegram</text>
    <text x="104" y="245" font-size="16" text-anchor="middle" fill="#b7aecb">Slack</text>
  </g>
  <g>
    <rect x="224" y="132" width="174" height="142" rx="14" fill="#17141f" stroke="#3f3854" stroke-width="1.5"/>
    <text x="311" y="171" font-size="22" font-weight="700" text-anchor="middle" fill="#efeaf8">Gateway</text>
    <text x="311" y="201" font-size="16" text-anchor="middle" fill="#b7aecb">상시 실행 서비스</text>
    <text x="311" y="231" font-size="16" text-anchor="middle" fill="#b7aecb">수신 · 라우팅 · 응답</text>
  </g>
  <g>
    <rect x="446" y="132" width="192" height="142" rx="14" fill="#24163a" stroke="url(#hero)" stroke-width="2.5"/>
    <rect x="470" y="129" width="144" height="6" rx="3" fill="url(#hero)"/>
    <text x="542" y="167" font-size="22" font-weight="700" text-anchor="middle" fill="#d6b2ff">OMP 헤드</text>
    <text x="542" y="195" font-size="16" text-anchor="middle" fill="#b7aecb">모델 + 컨트롤러</text>
    <text x="542" y="222" font-size="16" text-anchor="middle" fill="#b7aecb">판단 · 작업</text>
    <text x="542" y="250" font-size="15" font-weight="600" text-anchor="middle" fill="#d6b2ff">레인 제어는 헤드만</text>
  </g>
  <g>
    <rect x="754" y="80" width="182" height="108" rx="14" fill="#17141f" stroke="#3f3854" stroke-width="1.5"/>
    <rect x="802" y="77" width="86" height="6" rx="3" fill="#57e6fb"/>
    <text x="845" y="111" font-size="22" font-weight="700" text-anchor="middle" fill="#efeaf8">레인 A</text>
    <text x="845" y="138" font-size="16" text-anchor="middle" fill="#b7aecb">독립 세션</text>
    <text x="845" y="165" font-size="16" text-anchor="middle" fill="#b7aecb">저장소 / 주제 A</text>
  </g>
  <g>
    <rect x="754" y="230" width="182" height="108" rx="14" fill="#17141f" stroke="#3f3854" stroke-width="1.5"/>
    <rect x="802" y="227" width="86" height="6" rx="3" fill="#57e6fb"/>
    <text x="845" y="261" font-size="22" font-weight="700" text-anchor="middle" fill="#efeaf8">레인 B</text>
    <text x="845" y="288" font-size="16" text-anchor="middle" fill="#b7aecb">독립 세션</text>
    <text x="845" y="315" font-size="16" text-anchor="middle" fill="#b7aecb">저장소 / 주제 B</text>
  </g>
  <g>
    <path d="M24 360H49" fill="none" stroke="#bb86ff" stroke-width="2.4" marker-end="url(#control-arrow)"/>
    <text x="60" y="365" font-size="16" fill="#b7aecb">헤드에서 레인으로: lane_start 또는 lane_message</text>
    <path d="M24 383H49" fill="none" stroke="#a49bbd" stroke-width="1.8" marker-end="url(#flow-arrow)"/>
    <text x="60" y="388" font-size="16" fill="#b7aecb">레인에서 헤드로: 위임 작업 결과, 헤드에 보낸 질문, 원본 메시지에 연결된 범위 검토 요청</text>
    <text x="60" y="411" font-size="16" fill="#b7aecb">컨트롤러는 연결된 주제의 일반 요청과 답변을 헤드 모델 호출 없이 처리합니다.</text>
  </g>
</svg>
