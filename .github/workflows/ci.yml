name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Bun version
        id: runtime
        run: echo "bun=$(jq -r '.packageManager | sub("^bun@"; "")' package.json)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.runtime.outputs.bun }}
      - name: Install latest published OMP binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo can1357/oh-my-pi --json tagName --jq .tagName)"
          asset="$(bun -p '`omp-${process.platform}-${process.arch}`')"
          directory="$RUNNER_TEMP/omp"
          mkdir -p "$directory"
          echo "Testing current upstream OMP release: $tag"
          gh release download "$tag" --repo can1357/oh-my-pi \
            --pattern "$asset" --pattern SHA256SUMS.txt --dir "$directory"
          (cd "$directory" && grep "  $asset\$" SHA256SUMS.txt | shasum -a 256 -c -)
          mv "$directory/$asset" "$directory/omp"
          chmod +x "$directory/omp"
          echo "$directory" >> "$GITHUB_PATH"
      - name: Install project and managed ULW
        run: bun install --frozen-lockfile
      - name: Typecheck and offline native regression suite
        run: bun run test:ci
      - name: Package committed source
        run: bun run release
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Bun version
        id: runtime
        run: echo "bun=$(jq -r '.packageManager | sub("^bun@"; "")' package.json)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.runtime.outputs.bun }}
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release --publish
