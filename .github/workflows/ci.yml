name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Routine checks use the Intel pool; hosted arm64 jobs have been cancelled before checkout.
        os: [ubuntu-24.04, macos-15-intel]
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && '[{"os":"macos-15"}]' || '[]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install and test with the SDK-matched OMP release
        run: bun run test:baseline
      - name: Test with stock OMP 18
        run: bash scripts/test-omp.sh v18.22.2
      - name: Test the earlier OMP 18 native lifecycle
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/test-omp.sh v18.20.3
      - name: Package committed source
        run: bun run release
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release --publish

  npm:
    name: Publish npm package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Download and verify the released npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
          filename="$name-$version.tgz"
          mkdir -p dist
          cd dist
          gh release download "$GITHUB_REF_NAME" --pattern "$filename" --pattern "$filename.sha256"
          sha256sum --check --strict "$filename.sha256"
      - name: Publish with npm Trusted Publishing
        run: |
          filename=$(node -p 'const {name, version} = require("./package.json"); `${name}-${version}.tgz`')
          npm publish "./dist/$filename" --access public --ignore-scripts
