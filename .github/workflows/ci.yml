name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Bun version
        id: runtime
        run: echo "bun=$(jq -r .runtime.bun upstream/omp.json)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.runtime.outputs.bun }}
      - name: Prepare pinned OMP source
        run: bun scripts/prepare-omp.ts
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev cmake pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .upstream/omp -> target
      - name: Build native addon
        run: bun --cwd=.upstream/omp run build:native
      - name: Install project and managed ULW
        run: bun install --frozen-lockfile
      - name: Typecheck and offline native regression suite
        run: bun run test:ci
      - name: Package committed source
        run: bun run release
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Bun version
        id: runtime
        run: echo "bun=$(jq -r .runtime.bun upstream/omp.json)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.runtime.outputs.bun }}
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release --publish
